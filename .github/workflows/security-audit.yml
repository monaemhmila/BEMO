name: Security Audit & SBOM

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 0 * * 1" # Run weekly on Mondays

jobs:
  audit:
    name: Dependency Audit & SBOM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies (clean install)
        run: npm ci

      - name: Audit Production Runtime Dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Audit Full Dependency Graph
        run: npm audit --audit-level=critical

      - name: Typecheck Backend & Web
        run: |
          npm --workspace=backend run build
          npm --workspace=web run check-types
